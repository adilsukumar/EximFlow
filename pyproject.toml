[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eximflow"
version = "0.1.0"
description = "EximFlow AI - Autonomous Outbound & B2B International Trade Intelligence Platform"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "Pillow>=10.0.0",
    "reportlab>=4.2.0"
]
requires-python = ">=3.12"
